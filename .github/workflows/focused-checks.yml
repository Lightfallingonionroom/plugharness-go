name: Focused app checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          python3 tool/l10n_merge.py
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded \
            test/pets/custom_pets_test.dart \
            test/pets/custom_pet_archive_test.dart \
            test/settings/scene_accounts_test.dart \
            test/features/feature_layout_test.dart \
            test/pets/pet_pack_test.dart \
            test/pets/pet_parts_test.dart